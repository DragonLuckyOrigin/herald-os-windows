name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Fetch the pinned Hermes Agent snapshot
        run: npm run sync-upstream
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  bridge:
    name: Bridge plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r linux/tests/requirements.txt
      - name: pytest
        run: HERALD_OS_PYTHON="$(command -v python)" bash scripts/test-bridge.sh

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse every bash and Python script
        run: |
          failed=0
          while IFS= read -r file; do
            case "$(head -n 1 "$file")" in
              '#!'*bash*) bash -n "$file" || failed=1 ;;
              '#!'*python*) python3 -m py_compile "$file" || failed=1 ;;
            esac
          done < <(git ls-files)
          exit "$failed"

  signing:
    name: Signing policy
    runs-on: ubuntu-latest
    # Pull requests cannot read COSIGN_PRIVATE_KEY, so the repository variable SIGNING_ENABLED says
    # whether the image workflow signs; it and linux/image/cosign.pub must agree (#18).
    env:
      SIGNING_ENABLED: ${{ vars.SIGNING_ENABLED }}
    steps:
      - uses: actions/checkout@v7
      - name: cosign.pub and SIGNING_ENABLED agree
        run: |
          if [[ "$SIGNING_ENABLED" == "true" && ! -f linux/image/cosign.pub ]]; then
            # Expected while signing is being turned on (docs/LINUX.md): images are signed, not yet verified.
            echo "::warning::SIGNING_ENABLED is true but linux/image/cosign.pub is not committed yet: images are signed but machines do not verify them. Verify a signed image, then commit the public key."
          fi
          if [[ "$SIGNING_ENABLED" != "true" && -f linux/image/cosign.pub ]]; then
            echo "::error::linux/image/cosign.pub is committed but SIGNING_ENABLED is not true: set COSIGN_PRIVATE_KEY and SIGNING_ENABLED=true first, or the image build would ship an unsigned image that refuses its own updates."
            exit 1
          fi
          echo "Signing policy check passed (SIGNING_ENABLED=${SIGNING_ENABLED:-unset}, cosign.pub $([[ -f linux/image/cosign.pub ]] && echo present || echo absent))."

  windows-affected:
    name: Windows affected-scope checks (not full suite)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      npm_config_audit: 'false'
      npm_config_fund: 'false'
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Fetch the pinned Hermes Agent snapshot
        shell: bash
        run: bash scripts/sync-upstream.sh
      - run: npm ci
      - run: python -m pip install pytest pyyaml
      - name: Isolate affected-scope test data
        run: |
          $root = Join-Path $env:USERPROFILE "herald-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $user = Join-Path $root 'user'
          $dirs = @("$root/tmp", "$root/hermes", "$user/AppData/Roaming", "$user/AppData/Local", "$user/Documents", "$user/Pictures", "$user/Desktop")
          New-Item -ItemType Directory -Path $dirs -Force | Out-Null
          @("TEMP=$root/tmp", "TMP=$root/tmp", "HERMES_HOME=$root/hermes", "HOME=$user", "USERPROFILE=$user", "APPDATA=$user/AppData/Roaming", "LOCALAPPDATA=$user/AppData/Local", "PSModulePath=$env:SystemRoot/System32/WindowsPowerShell/v1.0/Modules") | Add-Content -LiteralPath $env:GITHUB_ENV
      - run: npm run typecheck
      - name: Windows affected TypeScript contracts
        working-directory: apps/desktop
        run: >-
          node ../../node_modules/vitest/vitest.mjs run --maxWorkers=2
          electron/platform/win32.test.ts
          electron/events/sources.test.ts
          electron/ipc/fs.test.ts
          electron/ipc/terminal.test.ts
          electron/backend/control-file.test.ts
          electron/backend/manager-control.test.ts
          electron/backend/manager.test.ts
          electron/backend/local-files.test.ts
          electron/backend/bridge-plugin.test.ts
          electron/backend/resolve.test.ts
          electron/shell/os-control.test.ts
          electron/office/convert.test.ts
          electron/office/print.test.ts
          src/features/office/agent-model.test.ts
          src/features/canvas/agent-model.test.ts
          src/features/files/files-store.test.ts
      - name: Native Windows pipe ACL, identity and lifecycle contracts
        working-directory: apps/desktop
        run: |
          $env:HERALD_TEST_PYTHON = Join-Path $env:pythonLocation 'python.exe'
          node ../../node_modules/vitest/vitest.mjs run --maxWorkers=1 electron/shell/windows-control-pipe.test.ts
          exit $LASTEXITCODE
      - name: Windows affected Python contracts (not Linux CLI tests)
        run: >-
          python -m pytest -q
          plugins/herald-os-bridge/tests/test_windows_host.py
          plugins/herald-os-bridge/tests/test_windows_pipe.py
          plugins/herald-os-bridge/tests/test_scope.py
          plugins/herald-os-bridge/tests/test_os_ui.py
          plugins/herald-os-bridge/tests/test_canvas.py
          plugins/herald-os-bridge/tests/test_docs.py
          plugins/herald-os-bridge/tests/test_sheets.py
          plugins/herald-os-bridge/tests/test_slides.py
      - run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: bash scripts/check-secrets.sh
